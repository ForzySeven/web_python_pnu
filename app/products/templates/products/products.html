{% extends 'base.html' %}

{% block title %}Каталог товарів{% endblock %}

{% block content %}
<h2 class="mb-4 fw-bold">Список товарів</h2>
<div class="row g-4">
    {% for item in products %}
    <div class="col-md-4">
        <div class="card h-100 shadow-sm border-0 p-3">
            <div class="card-body d-flex flex-column">
                <h3 class="h5 card-title fw-bold">{{ item.name }}</h3>
                <p class="text-success fw-bold fs-5 mb-2">${{ item.price }}</p>
                <p class="card-text text-muted flex-grow-1">{{ item.content }}</p>
                <a href="{{ url_for('products.detail_product', product_id=item.id) }}" class="btn btn-primary mt-3">Детальніше</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
