{% extends 'base.html' %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}
<div class="card shadow-sm border-0 p-4">
    <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3">
        <h2 class="h3 fw-bold mb-0">{{ product.name }}</h2>
        <span class="badge bg-success fs-5">${{ product.price }}</span>
    </div>
    <p class="fs-5 mb-4">{{ product.content }}</p>
    <div>
        <a href="{{ url_for('products.product_list') }}" class="btn btn-outline-secondary">&larr; Назад до списку товарів</a>
    </div>
</div>
{% endblock %}
