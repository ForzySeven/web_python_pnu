{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 p-4">
            <h2 class="text-center mb-4 fw-light display-6">Login</h2>
            <form method="POST" action="{{ url_for('users.login') }}">
                <div class="mb-3">
                    <label for="username" class="form-label">User name</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Введіть user1 або admin" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Введіть 1234 або admin" required>
                </div>
                <button type="submit" class="btn btn-info text-white w-100 py-2 fw-semibold">Sign in</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
