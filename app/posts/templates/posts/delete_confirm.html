{% extends 'base.html' %}

{% block title %}Видалення поста{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger p-4 text-center">
            <h3 class="text-danger fw-bold mb-3">Підтвердження видалення</h3>
            <p class="fs-5 mb-4">
                Ви дійсно бажаєте видалити пост <strong>«{{ post.title }}»</strong>? Цю дію неможливо скасувати.
            </p>
            <form method="POST" action="{{ url_for('posts.delete_post', id=post.id) }}" class="d-flex justify-content-center gap-3">
                <button type="submit" class="btn btn-danger px-4">Так, видалити</button>
                <a href="{{ url_for('posts.detail_post', id=post.id) }}" class="btn btn-outline-secondary px-4">Скасувати</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
