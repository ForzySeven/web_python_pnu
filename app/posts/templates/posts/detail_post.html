{% extends 'base.html' %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<div class="card shadow-sm border-0 p-4">
    <div class="d-flex justify-content-between align-items-start border-bottom pb-3 mb-3 flex-wrap gap-2">
        <div>
            <span class="badge bg-primary text-uppercase mb-2">{{ post.category }}</span>
            <h2 class="h3 fw-bold mb-1">{{ post.title }}</h2>
            <p class="text-muted small mb-0">
                Автор: <strong>{{ post.author }}</strong> | Опубліковано: {{ post.posted.strftime('%d.%m.%Y %H:%M') }}
            </p>
        </div>
        <div class="d-flex gap-2">
            <a href="{{ url_for('posts.update_post', id=post.id) }}" class="btn btn-warning btn-sm">Edit</a>
            <a href="{{ url_for('posts.delete_post', id=post.id) }}" class="btn btn-danger btn-sm">Delete</a>
        </div>
    </div>

    <div class="fs-5 mb-4" style="white-space: pre-line;">{{ post.content }}</div>

    <div>
        <a href="{{ url_for('posts.all_posts') }}" class="btn btn-outline-secondary">&larr; До списку постів</a>
    </div>
</div>
{% endblock %}
